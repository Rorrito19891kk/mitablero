<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tablero AAC Interactivo 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #7c3aed;
  --accent: #ec4899;
  --gold: #f59e0b;
  --green: #10b981;
  --bg: #f5f0ff;
  --card-radius: 20px;
  --nav-h: 62px;
}
*{box-sizing:border-box;margin:0;padding:0;border:none;outline:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
button{cursor:pointer;font-family:inherit;background:none}
svg{display:block}

/* ── PROGRESS BAR ─────────────────── */
#progress-bar{position:fixed;top:0;left:0;height:4px;width:0;
  background:linear-gradient(90deg,#a855f7,#ec4899,#f59e0b);
  z-index:9999;transition:width .1s linear;border-radius:0 4px 4px 0}

/* ── HERO ─────────────────────────── */
#hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:60px 24px 40px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1a0533 0%,#3b0764 40%,#6b21a8 70%,#a855f7 100%);
  animation:heroBg 8s ease-in-out infinite alternate;
}
@keyframes heroBg{
  0%{background-position:0% 50%}
  100%{background-position:100% 50%}
}
.hero-glow{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 30%,rgba(168,85,247,.35) 0%,transparent 70%);
  pointer-events:none;
}
.hero-emoji{
  position:absolute;font-size:2rem;animation:float 3.5s ease-in-out infinite;
  opacity:.7;pointer-events:none;user-select:none;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-22px) rotate(5deg)}}
.hero-title{
  font-family:'Fredoka One',cursive;font-size:clamp(2.4rem,8vw,4.2rem);
  color:#fff;line-height:1.1;margin-bottom:12px;
  text-shadow:0 4px 24px rgba(0,0,0,.4);
  animation:fadeInDown .9s ease both;
}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.hero-sub{
  color:rgba(255,255,255,.82);font-size:clamp(1rem,3.5vw,1.3rem);
  font-weight:800;margin-bottom:28px;
  animation:fadeInDown .9s .15s ease both;
}
.hero-badges{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:36px;
  animation:fadeInDown .9s .3s ease both;
}
.hero-badge{
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  border:2px solid rgba(255,255,255,.3);
  border-radius:50px;padding:8px 18px;
  color:#fff;font-weight:900;font-size:.9rem;
}
.hero-cta{
  font-family:'Fredoka One',cursive;font-size:1.3rem;
  background:linear-gradient(135deg,#f59e0b,#ec4899);
  color:#fff;border-radius:50px;padding:16px 40px;
  box-shadow:0 8px 32px rgba(236,72,153,.5);
  animation:fadeInDown .9s .45s ease both, pulse 2.5s 1.5s ease-in-out infinite;
  transition:transform .15s;
}
.hero-cta:hover{transform:scale(1.06)}
@keyframes pulse{0%,100%{box-shadow:0 8px 32px rgba(236,72,153,.5)}50%{box-shadow:0 12px 44px rgba(236,72,153,.75)}}
.hero-scroll-hint{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.5);font-size:.8rem;font-weight:800;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  animation:fadeInDown 1s 1s ease both;
}
.scroll-arrow{width:20px;height:20px;border-right:3px solid rgba(255,255,255,.4);
  border-bottom:3px solid rgba(255,255,255,.4);transform:rotate(45deg);
  animation:arrowBounce 1.4s ease-in-out infinite}
@keyframes arrowBounce{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(6px)}}

/* ── APP SHELL ────────────────────── */
#app{min-height:100svh}

#app-nav{
  position:sticky;top:0;z-index:200;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-bottom:2px solid #ede8ff;
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;height:var(--nav-h);
  box-shadow:0 4px 20px rgba(124,58,237,.1);
}
.nav-tab{
  flex:1;font-family:'Fredoka One',cursive;font-size:clamp(.8rem,2.5vw,1rem);
  border-radius:14px;padding:10px 6px;font-weight:900;
  transition:all .2s;
}
.nav-tab.active{
  background:linear-gradient(135deg,var(--primary),#a855f7);
  color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.4);
}
.nav-tab:not(.active){background:#f1eeff;color:#555}
.nav-tab:not(.active):hover{background:#e8e0ff}
#btn-fullscreen{
  background:#f1eeff;border-radius:12px;
  padding:9px 11px;font-size:1.1rem;
  flex-shrink:0;color:var(--primary);font-weight:900;
  transition:all .2s;
}
#btn-fullscreen:hover{background:#e8e0ff}

/* ── TAB CONTENT ──────────────────── */
.tab-panel{display:none;padding:12px;min-height:calc(100svh - var(--nav-h))}
.tab-panel.active{display:block}

/* ── SENTENCE BAR ─────────────────── */
.sentence-bar{
  background:#fff;border-radius:20px;
  padding:12px 14px;
  box-shadow:0 4px 20px rgba(0,0,0,.07);
  margin-bottom:12px;
}
.sentence-chips{
  min-height:44px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;margin-bottom:10px;
}
.sentence-hint{color:#c4b5d8;font-size:.85rem;font-weight:800}
.chip{
  border-radius:12px;padding:5px 11px;
  font-size:.82rem;font-weight:900;color:#444;
  display:flex;align-items:center;gap:6px;
  border:2px solid transparent;
  animation:chipPop .25s cubic-bezier(.175,.885,.32,1.275) both;
}
@keyframes chipPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.sentence-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.btn-del{background:#f3f0ff;color:var(--primary);border-radius:12px;padding:7px 13px;font-size:.82rem;font-weight:900}
.btn-clr{background:#ffe4e8;color:#e11d48;border-radius:12px;padding:7px 13px;font-size:.82rem;font-weight:900}
.btn-say{
  border-radius:12px;padding:7px 16px;font-size:.82rem;font-weight:900;color:#fff;
  background:linear-gradient(135deg,#10b981,#34d399);
  box-shadow:0 4px 14px rgba(16,185,129,.4);
  transition:transform .15s;
}
.btn-say:disabled{background:#e5e7eb;color:#9ca3af;box-shadow:none}
.btn-say:not(:disabled):hover{transform:scale(1.05)}
.btn-say.speaking{animation:speakPulse .6s ease-in-out infinite alternate}
@keyframes speakPulse{to{box-shadow:0 6px 24px rgba(16,185,129,.7);transform:scale(1.06)}}

/* ── CATEGORY PILLS ───────────────── */
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-pill{
  white-space:nowrap;border-radius:50px;
  padding:9px 16px;font-size:.88rem;font-weight:900;
  transition:all .2s;flex-shrink:0;
}

/* ── PICTO GRID ───────────────────── */
.picto-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:10px;
}
.picto-card{
  background:#fff;border-radius:var(--card-radius);
  padding:14px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  border:3px solid transparent;
  cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;
  position:relative;overflow:hidden;
  /* reveal */
  opacity:0;transform:translateY(20px);
}
.picto-card.visible{opacity:1;transform:translateY(0)}
.picto-card:active{transform:scale(.94)!important}
.picto-card.popped{border-color:currentColor;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.picto-top-bar{position:absolute;top:0;left:0;right:0;height:4px;border-radius:20px 20px 0 0}
.picto-emoji{font-size:2.8rem;line-height:1}
.picto-label{font-size:.8rem;font-weight:900;color:#444;text-align:center;line-height:1.2}

/* ── SYLLABLE BOARD ───────────────── */
.alpha-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));
  gap:6px;max-height:230px;overflow-y:auto;
  padding:2px;scrollbar-width:thin;
}
.alpha-btn{
  aspect-ratio:1;border-radius:12px;
  font-family:'Fredoka One',cursive;font-size:1.2rem;
  color:#fff;font-weight:900;
  border:4px solid transparent;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;cursor:pointer;
  text-shadow:0 2px 4px rgba(0,0,0,.25);
}
.alpha-btn.active{
  border-color:#222;
  transform:translateY(2px);
  box-shadow:0 0 0 2px #fff, 0 0 0 5px currentColor !important;
}
.syl-cards-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:14px;padding:10px 0;
}
.syl-card{
  border-radius:26px;border:3px solid;
  padding:18px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .15s;min-height:140px;
  opacity:0;transform:translateY(20px);
}
.syl-card.visible{opacity:1;transform:translateY(0)}
.syl-card:active{transform:scale(.94)!important}
.syl-ghost{
  position:absolute;font-family:'Fredoka One',cursive;font-size:6rem;
  opacity:.07;top:-14px;right:-10px;line-height:1;
  user-select:none;pointer-events:none;text-transform:uppercase;
}
.syl-main{font-family:'Fredoka One',cursive;font-size:4rem;line-height:1;text-transform:uppercase}
.syl-sub{font-size:.7rem;font-weight:800;color:#888;text-transform:lowercase;letter-spacing:1px}
.quick-strip{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:10px 12px 12px;background:#fff;
  border-top:1px solid #f0e8ff;margin-top:10px;border-radius:0 0 16px 16px;
}
.quick-btn{
  font-family:'Fredoka One',cursive;color:#fff;
  border-radius:14px;padding:10px 20px;font-size:1.3rem;
  transition:transform .1s;text-transform:uppercase;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.quick-btn:active{transform:scale(.92)}

/* ── GAMES ────────────────────────── */
.game-tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.game-tab{
  white-space:nowrap;border-radius:14px;padding:10px 16px;
  font-size:.85rem;font-weight:900;transition:all .2s;flex-shrink:0;
}
.game-tab.active{color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.game-tab:not(.active){background:#f1eeff;color:#555}

/* Arma la Palabra */
.word-card{
  background:linear-gradient(135deg,#fde68a,#fbbf24);
  border-radius:28px;padding:24px 32px;text-align:center;
  box-shadow:0 8px 28px rgba(251,191,36,.45);
  border:4px solid #fbbf24;cursor:pointer;
  display:inline-block;
}
.word-emoji{font-size:5.5rem;line-height:1}
.word-label{font-family:'Fredoka One',cursive;font-size:1.4rem;color:#92400e;margin-top:8px}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot{
  width:62px;height:62px;border-radius:18px;
  border:3px dashed #a78bfa;background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:1.4rem;color:#7c3aed;
  transition:all .2s;
}
.slot.filled{background:#ede9fe;border-style:solid}
.slot.ok{background:#d1fae5;border-color:#10b981;color:#065f46}
.slot.err{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.syl-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.syl-opt{
  background:linear-gradient(135deg,#a78bfa,#7c3aed);
  color:#fff;border-radius:16px;padding:12px 18px;
  font-size:1.35rem;font-weight:900;font-family:'Fredoka One',cursive;
  box-shadow:0 4px 14px rgba(124,58,237,.4);
  transition:all .15s;min-width:54px;text-align:center;
}
.syl-opt:disabled{background:#e5e7eb;color:#aaa;box-shadow:none}
.syl-opt:not(:disabled):active{transform:scale(.92)}
.result-banner{
  border-radius:20px;padding:16px 28px;text-align:center;
  font-family:'Fredoka One',cursive;font-size:1.4rem;color:#fff;
  margin:10px auto;max-width:320px;
}
.stars-count{
  font-family:'Fredoka One',cursive;font-size:1.1rem;color:#f59e0b;
  text-align:right;margin-bottom:8px;min-height:28px;
}

/* Letra Inicial */
.letra-display{
  background:linear-gradient(135deg,#6366f1,#a855f7);
  border-radius:28px;width:120px;height:120px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 28px rgba(99,102,241,.45);
  border:4px solid #fff;margin:0 auto 16px;
}
.letra-big{font-family:'Fredoka One',cursive;font-size:4.5rem;color:#fff;line-height:1}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:380px;margin:0 auto}
.opt-card{
  background:#fff;border-radius:22px;border:3px solid #e5e7eb;
  padding:16px 8px;display:flex;flex-direction:column;
  align-items:center;gap:8px;cursor:pointer;transition:all .2s;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
.opt-card:active{transform:scale(.94)}
.opt-card.correct{background:#d1fae5;border-color:#10b981}
.opt-card.wrong{background:#fee2e2;border-color:#ef4444}
.opt-card.reveal-ok{background:#d1fae5;border-color:#10b981}
.opt-emoji{font-size:3.4rem}
.opt-word{font-family:'Fredoka One',cursive;font-size:1rem;color:#444}
.opt-result{font-size:1.4rem;margin-top:4px}

/* Memoria */
.memo-info{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:800;color:#8b7aaa;font-size:.9rem}
.memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:0 auto}
.memo-card{
  aspect-ratio:1;border-radius:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s,opacity .3s;
  border:3px solid transparent;
  box-shadow:0 4px 14px rgba(99,102,241,.3);
  font-family:'Fredoka One',cursive;font-size:1.6rem;
  color:#fff;text-transform:uppercase;
}
.memo-card.face-down{background:linear-gradient(135deg,#6366f1,#a855f7)}
.memo-card.face-up{background:var(--clr,#6366f1)}
.memo-card.matched{border-color:#10b981;opacity:.65}

/* Paint */
.paint-pics{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.paint-pic-btn{
  white-space:nowrap;border-radius:14px;padding:8px 14px;font-size:.88rem;font-weight:900;
  transition:all .2s;flex-shrink:0;
}
.paint-canvas{
  background:#fff;border-radius:24px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  border:3px solid #f0e8ff;
  display:flex;align-items:center;justify-content:center;
  padding:14px;min-height:220px;max-height:330px;overflow:hidden;
}
.paint-canvas svg{width:100%;height:100%;max-height:300px}
.paint-palette{
  background:#fff;border-radius:20px;padding:10px 14px;
  box-shadow:0 4px 16px rgba(0,0,0,.07);margin-top:10px;
}
.palette-label{font-size:.65rem;color:#bdb5d8;font-weight:800;letter-spacing:1px;text-align:center;margin-bottom:8px}
.palette-dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.palette-dot{
  width:34px;height:34px;border-radius:50%;cursor:pointer;
  border:3px solid rgba(0,0,0,.1);
  transition:all .15s;
}
.palette-dot.active{border-color:var(--primary);transform:scale(1.3);
  box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--primary)}
.eraser{
  width:34px;height:34px;border-radius:50%;cursor:pointer;
  background:#fff;border:3px solid #ddd;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  transition:all .15s;
}
.eraser.active{border-color:var(--primary);transform:scale(1.3);
  box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--primary)}
.btn-clr-paint{
  display:block;margin:8px auto 0;background:#fee2e2;color:#ef4444;
  border-radius:12px;padding:6px 20px;font-size:.8rem;font-weight:900;
}

/* ── SUCCESS / NEXT BUTTONS ───────── */
.btn-next{
  font-family:'Fredoka One',cursive;font-size:1rem;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  color:#fff;border-radius:16px;padding:12px 28px;
  box-shadow:0 4px 16px rgba(99,102,241,.4);
  margin-top:14px;display:block;
}
.btn-next:hover{transform:scale(1.05)}
.btn-back{
  background:#fee2e2;color:#ef4444;border-radius:12px;
  padding:7px 16px;font-size:.82rem;font-weight:900;margin-top:8px;
}

/* ── SECTION HEADER ───────────────── */
.section-head{
  font-family:'Fredoka One',cursive;font-size:1rem;
  margin-bottom:8px;padding:4px 2px;
}

/* ── CONFETTI OVERLAY ─────────────── */
#confetti-canvas{
  position:fixed;inset:0;pointer-events:none;z-index:8000;
}
#celebrate-overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:8500;pointer-events:none;
}
.celebrate-box{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  border-radius:28px;padding:28px 40px;text-align:center;
  box-shadow:0 12px 48px rgba(251,191,36,.6);
  font-family:'Fredoka One',cursive;font-size:1.8rem;color:#fff;
  animation:celebPop .5s cubic-bezier(.175,.885,.32,1.275) both;
}
@keyframes celebPop{from{transform:scale(0) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

/* ── GENERIC UTILS ────────────────── */
.center{text-align:center}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.mt16{margin-top:16px}
.flex-center{display:flex;justify-content:center;align-items:center}
.hint-text{font-size:.82rem;font-weight:800;color:#8b7aaa;text-align:center;margin:6px 0}

/* ── FULLSCREEN ───────────────────── */
body.is-fullscreen #hero{display:none}
body.is-fullscreen #app{height:100dvh;overflow:hidden}
body.is-fullscreen .tab-panel{height:calc(100dvh - var(--nav-h));overflow-y:auto}

/* ── SCROLL TRANSITION ────────────── */
.picto-card{transition:opacity .45s ease, transform .45s ease, box-shadow .15s, border-color .15s}
.syl-card{transition:opacity .45s ease, transform .45s ease}

/* ── MARCADOR DE VISITAS (oculto) ─── */
#visit-panel{
  position:fixed;bottom:20px;right:20px;z-index:99999;
  background:linear-gradient(135deg,#1e1b4b,#3730a3);
  color:#fff;border-radius:20px;padding:16px 20px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  font-family:'Fredoka One',cursive;
  min-width:220px;
  animation:celebPop .35s cubic-bezier(.175,.885,.32,1.275) both;
}
#visit-panel.hide{animation:fadeOutDown .3s ease both}
@keyframes fadeOutDown{to{opacity:0;transform:translateY(20px)}}
.vp-title{font-size:1rem;opacity:.7;margin-bottom:10px;letter-spacing:1px;font-family:'Nunito',sans-serif;font-weight:800}
.vp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.vp-label{font-size:.78rem;opacity:.65;font-family:'Nunito',sans-serif;font-weight:700}
.vp-val{font-size:1.1rem;color:#fbbf24}
.vp-big{font-size:2.2rem;color:#fbbf24;text-align:center;line-height:1;margin-bottom:4px}
.vp-close{position:absolute;top:10px;right:14px;cursor:pointer;font-size:1rem;opacity:.6}
.vp-close:hover{opacity:1}

/* ── ABRAPALABRA ──────────────────── */
#app-nav{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
#app-nav::-webkit-scrollbar{display:none}
.nav-tab{flex:1;min-width:fit-content;font-size:clamp(.7rem,2vw,.92rem)}
.abra-sub-btn{
  white-space:nowrap;border-radius:14px;padding:9px 16px;
  font-size:.88rem;font-weight:900;flex-shrink:0;
  background:#f1eeff;color:#555;transition:all .2s;
}
.abra-sub-btn.abra-active{
  background:linear-gradient(135deg,#6b21a8,#a855f7);
  color:#fff;box-shadow:0 4px 14px rgba(107,33,168,.4);
}
</style>
</head>
<body>

<div id="progress-bar"></div>

<!-- ══ HERO ════════════════════════════════ -->
<section id="hero">
  <div class="hero-glow"></div>
  <!-- floating emojis injected by JS -->
  <div id="hero-emojis"></div>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const fixed = PHONETIC_FIXES[text] ?? text;
  const u = new SpeechSynthesisUtterance(fixed);
  u.lang = 'es-CL';
  u.rate = 0.78;
  u.pitch = 1.1;
  window.speechSynthesis.speak(u);
}

    r: 6 + Math.random() * 8,
    d: 1.5 + Math.random() * 2.5,
    color: `hsl(${Math.random()*360},80%,60%)`,
    tilt: Math.random() * 10 - 5,
    tiltSpeed: 0.15 + Math.random() * 0.15,
    angle: 0,
  }));
  overlay.style.display = 'flex';
  msgEl.textContent = msg;
  if (confettiAnim) cancelAnimationFrame(confettiAnim);
  let tick = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.angle += p.tiltSpeed;
      p.y += p.d;
      p.tilt = Math.sin(p.angle) * 12;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r/2, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r/2);
      ctx.stroke();
    });
    tick++;
    if (tick < 180) confettiAnim = requestAnimationFrame(draw);
    else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  draw();
  setTimeout(() => { overlay.style.display = 'none'; }, 2200);
}

// ══════════════════════════════════════════
let revealObserver = null;
function setupScrollReveal() {
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        revealObserver.unobserve(e.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.picto-card:not(.visible), .syl-card:not(.visible)').forEach(el => {
    revealObserver.observe(el);
  });
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().then(() => {
      document.body.classList.add('is-fullscreen');
      document.getElementById('btn-fullscreen').textContent = '✕';
    });
  } else {
    document.exitFullscreen().then(() => {
      document.body.classList.remove('is-fullscreen');
      document.getElementById('btn-fullscreen').textContent = '🖥️';
    });
  }
}
document.addEventListener('fullscreenchange', () => {

  }
});

// ── GAME 1: Arma la Palabra ────────────────
function initArma() {
  const g = S.game.arma;
  const word = WORDS_DATA[g.idx];
  const correct = word.syllables;
  const pool = ["be","ca","de","fe","le","me","pe","re","se","te","bo","do","lo","mo","ro","so","bi","di","li","ni","pi","ri","si","ti","vi"];
  const distractors = shuffle(pool.filter(s => !correct.includes(s))).slice(0,3);
  g.opts = shuffle([...correct, ...distractors]);
  g.chosen = [];
  g.result = null;
}

function renderArma() {
  const g = S.game.arma;
  const word = WORDS_DATA[g.idx];
  const slots = word.syllables.map((_,i) => {
    let cls = 'slot';
    if (g.chosen[i]) cls += ' filled';
    if (g.result === 'ok') cls += ' ok';
    if (g.result === 'err') cls += ' err';
    return `<div class="${cls}">${g.chosen[i]||''}</div>`;
  }).join('');

  const opts = g.result ? '' : g.opts.map((syl,oi) => {
    const usedCount = g.chosen.filter(s => s===syl).length;
    const availCount = word.syllables.filter(s => s===syl).length;
    const disabled = usedCount >= availCount;
    return `<button class="syl-opt" onclick="armaPickSyl('${syl}')" ${disabled?'disabled':''}
      style="${disabled?'background:#e5e7eb;color:#aaa;box-shadow:none':''}">
      ${syl}
    </button>`;
  }).join('');

  const resultBanner = g.result === 'ok' ? `
    <div class="result-banner" style="background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 22px rgba(16,185,129,.4)">
      🎉 ¡Muy bien! 🌟
      <button class="btn-next" onclick="armaNext()" style="margin:10px auto 0">Siguiente ▶</button>
    </div>` : '';

  const backBtn = !g.result && g.chosen.length > 0
    ? `<button class="btn-back" onclick="armaBack()">↩ Borrar</button>` : '';

  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:20px">
      <div class="stars-count">${'⭐'.repeat(g.stars)}</div>
      <div class="word-card" onclick="speak('${word.word}')">
        <div class="word-emoji">${word.emoji}</div>
        <div class="word-label">${word.word}</div>
      </div>
      <p class="hint-text">Toca las sílabas en orden para formar la palabra 👆</p>
      <div class="slots">${slots}</div>
      ${resultBanner}
      <div class="syl-opts">${opts}</div>
      ${backBtn}
    </div>`;
}

function armaPickSyl(syl) {
  const g = S.game.arma;
  if (g.result) return;
  speak(syl);
  g.chosen = [...g.chosen, syl];
  const word = WORDS_DATA[g.idx];
  if (g.chosen.length === word.syllables.length) {
    const ok = g.chosen.join('') === word.syllables.join('');
    g.result = ok ? 'ok' : 'err';
    if (ok) {
      g.stars++;
      speak('¡Muy bien! Eso es ' + word.word);
      setTimeout(() => celebrate('🎉 ¡' + word.word.toUpperCase() + '! 🌟'), 300);
    } else {
      speak('Intenta de nuevo');
      setTimeout(() => { g.chosen = []; g.result = null; renderGames(); }, 1200);
      return;
    }
  }
  renderGames();
}
function armaBack() { S.game.arma.chosen = S.game.arma.chosen.slice(0,-1); renderGames(); }
function armaNext() {
  const g = S.game.arma;
  g.idx = (g.idx + 1) % WORDS_DATA.length;
  initArma();
  renderGames();
}

// ── GAME 3: Memoria ────────────────────────
function initMemo() {
  const syls = MEM_SYLLABLES.slice(0, 8);
  const deck = shuffle([...syls, ...syls].map((s, i) => ({
    id: i, syl: s, colorIdx: MEM_SYLLABLES.indexOf(s)
  })));
  S.game.memo = { cards: deck, flipped: [], matched: [], moves: 0 };
}

function renderMemo() {
  const g = S.game.memo;
  const won = g.matched.length === 8;

  const cards = g.cards.map(card => {
    const isFlipped = g.flipped.includes(card.id) || g.matched.includes(card.syl);
    const isMatched = g.matched.includes(card.syl);
    const clr = CARD_COLORS[card.colorIdx];
    return `<div class="memo-card ${isFlipped?'face-up':'face-down'} ${isMatched?'matched':''}"
      style="${isFlipped?`--clr:${clr};background:linear-gradient(135deg,${clr},${clr}cc)`:''}
      ${isMatched?'border-color:#10b981':''}"
      onclick="memoTap(${card.id})">
      ${isFlipped ? `<span>${card.syl}</span>` : '<span style="font-size:1.4rem">🌸</span>'}
    </div>`;
  }).join('');

  const wonBanner = won ? `
    <div class="result-banner" style="background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 6px 22px rgba(251,191,36,.5);margin-bottom:12px">
      🎉 ¡Ganaste! 🌟🌟🌟
      <button class="btn-next" onclick="memoRestart()" style="margin:10px auto 0;background:white;color:#d97706">
        Jugar de nuevo 🔄
      </button>
    </div>` : '';

  return `
    <div style="padding-bottom:20px">
      <div class="memo-info">
        <span>Movimientos: ${g.moves}</span>
        <span>${g.matched.length}/8 pares ⭐</span>
      </div>
      <p class="hint-text">Encuentra los pares de sílabas iguales 🃏</p>
      ${wonBanner}
      <div class="memo-grid">${cards}</div>
    </div>`;
}

let memoTimeout = null;
function memoTap(id) {
  const g = S.game.memo;
  if (g.flipped.length === 2) return;
  if (g.flipped.includes(id)) return;
  if (g.matched.includes(g.cards.find(c=>c.id===id)?.syl)) return;
  const card = g.cards.find(c => c.id === id);
  speak(card.syl);
  g.flipped = [...g.flipped, id];
  if (g.flipped.length === 2) {
    g.moves++;
    const [a, b] = g.flipped.map(fid => g.cards.find(c => c.id === fid));
    if (a.syl === b.syl) {
      g.matched = [...g.matched, a.syl];
      g.flipped = [];
      if (g.matched.length === 8) {
        speak('¡Felicidades! ¡Ganaste!');
        setTimeout(() => celebrate('🎉 ¡Ganaste! 🌟🌟🌟'), 300);
      }
    } else {
      memoTimeout = setTimeout(() => { g.flipped = []; renderGames(); }, 900);
    }
  }
  renderGames();
}
function memoRestart() { initMemo(); renderGames(); }

function getSVG(picIdx, fills) {

function renderPaint() {
  const g = S.game.paint;
  const picTabs = PAINT_PICS.map((p,i) =>
    `<button class="paint-pic-btn" onclick="paintChangePic(${i})"
      style="background:${g.picIdx===i?'linear-gradient(135deg,#f953c6,#b91d73)':'#f1eeff'};
      color:${g.picIdx===i?'#fff':'#555'};
      box-shadow:${g.picIdx===i?'0 4px 14px rgba(249,83,198,.4)':'none'}">${p.name}</button>`).join('');

  const dots = PALETTE.map(p =>
    `<div class="palette-dot${g.color===p.color?' active':''}"
      style="background:${p.color}"
      onclick="paintSetColor('${p.color}','${p.name}')"></div>`).join('');

  return `
    <div style="padding-bottom:20px">
      <div class="paint-pics">${picTabs}</div>
      <div class="paint-canvas" id="paint-svg-wrap">
        ${getSVG(g.picIdx, g.fills)}
      </div>
      <div class="paint-palette">
        <div class="palette-label">ELIGE UN COLOR Y TOCA LA FIGURA 🎨</div>
        <div class="palette-dots">
          ${dots}
          <div class="eraser${g.color==='#ffffff'?' active':''}" onclick="paintSetColor('#ffffff','borrar')">🧹</div>
        </div>
        <button class="btn-clr-paint" onclick="paintClear()">🗑️ Limpiar todo</button>
      </div>
    </div>`;
}

function attachPaintEvents() {
  const wrap = document.getElementById('paint-svg-wrap');
  if (!wrap) return;
  wrap.addEventListener('click', e => {
    const region = e.target.getAttribute('data-region');
    if (!region) return;
    const g = S.game.paint;
    g.fills[region] = g.color;
    speak(PALETTE.find(p=>p.color===g.color)?.name || 'borrar');
    const svgWrap = document.getElementById('paint-svg-wrap');
    if (svgWrap) svgWrap.innerHTML = getSVG(g.picIdx, g.fills);
    attachPaintEvents();
  });
}

function paintSetColor(color, name) {
  speak(name);
  S.game.paint.color = color;
  renderGames();
}
function paintChangePic(i) {
  S.game.paint.picIdx = i;
  S.game.paint.fills = {};
  renderGames();
}
function paintClear() { S.game.paint.fills = {}; renderGames(); }

// ══════════════════════════════════════════
// JUEGOS DE MATEMÁTICAS
// ══════════════════════════════════════════
const MATH_EMOJIS = ['🍎','⭐','🐶','🌸','🍪','🎈','🐠','🌻','🍭','🦋'];

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// ── JUEGO 5: Contar ────────────────────────
function initContar() {
  const g = S.game.contar;
  g.cantidad = randInt(1, 10);
  g.emoji    = MATH_EMOJIS[randInt(0, MATH_EMOJIS.length - 1)];
  g.result   = null;
  // 4 opciones: la correcta + 3 distractores
  const correct = g.cantidad;
  const pool = new Set();
  while (pool.size < 3) {
    const n = randInt(1, 10);
    if (n !== correct) pool.add(n);
  }
  g.opts = shuffle([correct, ...pool]);
}

function renderContar() {
  const g = S.game.contar;
  const objetos = Array(g.cantidad).fill(g.emoji).join(' ');

  const botones = g.opts.map(n => {
    let bg = 'linear-gradient(135deg,#10b981,#34d399)';
    let extra = '';
    if (g.result !== null) {
      if (n === g.cantidad) { bg = 'linear-gradient(135deg,#10b981,#34d399)'; extra = ' ✅'; }
      else if (n === g.result) { bg = 'linear-gradient(135deg,#ef4444,#fca5a5)'; extra = ' ❌'; }
      else bg = '#e5e7eb';
    }
    return `<button onclick="contarElegir(${n})"
      ${g.result !== null && n !== g.cantidad ? 'disabled' : ''}
      style="background:${bg};color:${g.result !== null && n !== g.cantidad && n !== g.result ? '#aaa':'#fff'};
      border-radius:20px;padding:18px 10px;font-family:'Fredoka One',cursive;font-size:2rem;
      box-shadow:${g.result===null?'0 5px 18px rgba(16,185,129,.4)':'none'};
      transition:all .2s;width:100%">${n}${extra}</button>`;
  }).join('');

  const resultBanner = g.result === g.cantidad ? `
    <div class="result-banner" style="background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 22px rgba(16,185,129,.4)">
      🎉 ¡Correcto! Son ${g.cantidad} ${g.emoji}
      <button class="btn-next" onclick="initContar();renderGames()" style="margin:10px auto 0">
        Siguiente ▶
      </button>
    </div>` : g.result !== null ? `
    <div class="result-banner" style="background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 6px 22px rgba(245,158,11,.4)">
      Son ${g.cantidad}... ¡Inténtalo de nuevo! 💪
      <button class="btn-next" onclick="initContar();renderGames()"
        style="margin:10px auto 0;background:white;color:#d97706">Otra vez 🔄</button>
    </div>` : '';

  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:20px">
      <div class="stars-count">${'⭐'.repeat(g.stars)}</div>
      <div style="font-family:'Fredoka One',cursive;font-size:1.1rem;color:#10b981;text-align:center">
        ¿Cuántos ${g.emoji} hay? 👀
      </div>
      <!-- Objetos a contar -->
      <div onclick="speak('Cuenta los ${g.emoji}')"
        style="background:linear-gradient(135deg,#ecfdf5,#d1fae5);
        border:3px solid #6ee7b7;border-radius:24px;padding:24px 20px;
        text-align:center;width:100%;max-width:360px;
        font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.7;cursor:pointer;
        box-shadow:0 6px 24px rgba(16,185,129,.2);word-break:break-all">
        ${objetos}
      </div>
      <p class="hint-text">Toca el número correcto 👇</p>
      <!-- Opciones -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px">
        ${botones}
      </div>
      ${resultBanner}
    </div>`;
}

function contarElegir(n) {
  const g = S.game.contar;
  if (g.result !== null) return;
  g.result = n;
  speak(String(n));
  if (n === g.cantidad) {
    g.stars++;
    speak('¡Muy bien! Son ' + g.cantidad);
    setTimeout(() => celebrate('🔢 ¡' + g.cantidad + ' ' + g.emoji + '! 🎉'), 300);
  } else {
    speak('Intenta de nuevo');
  }
  renderGames();
}

// ── JUEGO 6: Sumar ─────────────────────────
function initSumar() {
  const g = S.game.sumar;
  g.a     = randInt(1, 5);
  g.b     = randInt(1, 5);
  g.emoji = MATH_EMOJIS[randInt(0, MATH_EMOJIS.length - 1)];
  g.result = null;
  const correct = g.a + g.b;
  const pool = new Set();
  while (pool.size < 3) {
    const n = randInt(Math.max(1, correct - 3), Math.min(10, correct + 3));
    if (n !== correct) pool.add(n);
  }
  g.opts = shuffle([correct, ...pool]);
}

function renderSumar() {
  const g = S.game.sumar;
  const correct = g.a + g.b;
  const grupoA  = Array(g.a).fill(g.emoji).join('');
  const grupoB  = Array(g.b).fill(g.emoji).join('');

  const botones = g.opts.map(n => {
    let bg = '#f1eeff', color = '#7c3aed', shadow = 'none';
    if (g.result !== null) {
      if (n === correct) { bg = 'linear-gradient(135deg,#10b981,#34d399)'; color = '#fff'; shadow = '0 4px 14px rgba(16,185,129,.4)'; }
      else if (n === g.result) { bg = 'linear-gradient(135deg,#ef4444,#fca5a5)'; color = '#fff'; }
      else { bg = '#e5e7eb'; color = '#aaa'; }
    }
    return `<button onclick="sumarElegir(${n})"
      ${g.result !== null && n !== correct ? 'disabled' : ''}
      style="background:${bg};color:${color};border-radius:18px;padding:16px 8px;
      font-family:'Fredoka One',cursive;font-size:1.8rem;width:100%;
      box-shadow:${shadow};transition:all .2s">${n}</button>`;
  }).join('');

  const resultBanner = g.result === correct ? `
    <div class="result-banner" style="background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 6px 22px rgba(245,158,11,.4)">
      🌟 ¡Correcto! ${g.a} + ${g.b} = ${correct}
      <button class="btn-next" onclick="initSumar();renderGames()" style="margin:10px auto 0">
        Siguiente ▶
      </button>
    </div>` : g.result !== null ? `
    <div class="result-banner" style="background:linear-gradient(135deg,#6366f1,#818cf8);box-shadow:0 6px 22px rgba(99,102,241,.4)">
      La respuesta es ${correct} 💡
      <button class="btn-next" onclick="initSumar();renderGames()"
        style="margin:10px auto 0;background:white;color:#4f46e5">Otra vez 🔄</button>
    </div>` : '';

  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:20px">
      <div class="stars-count">${'⭐'.repeat(g.stars)}</div>
      <!-- Ecuación visual -->
      <div onclick="speak('${g.a} más ${g.b} es igual a cuánto')"
        style="background:linear-gradient(135deg,#fffbeb,#fef3c7);
        border:3px solid #fbbf24;border-radius:24px;
        padding:20px 16px;width:100%;max-width:360px;cursor:pointer;
        box-shadow:0 6px 24px rgba(251,191,36,.25);text-align:center">
        <!-- Grupo A -->
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px;
          font-size:2rem;line-height:1.5;min-height:44px">${grupoA}</div>
        <!-- Operador -->
        <div style="font-family:'Fredoka One',cursive;font-size:2.2rem;
          color:#d97706;margin:6px 0">＋</div>
        <!-- Grupo B -->
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px;
          font-size:2rem;line-height:1.5;min-height:44px">${grupoB}</div>
        <!-- Igual -->
        <div style="font-family:'Fredoka One',cursive;font-size:2.2rem;color:#d97706;margin-top:6px">
          ＝ <span style="color:#92400e;font-size:2.5rem">?</span>
        </div>
        <div style="font-family:'Fredoka One',cursive;font-size:1.2rem;color:#b45309;margin-top:4px">
          ${g.a} + ${g.b} = ?
        </div>
      </div>
      <p class="hint-text">¿Cuántos ${g.emoji} hay en total? 🤔</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px">
        ${botones}
      </div>
      ${resultBanner}
    </div>`;
}

function sumarElegir(n) {
  const g = S.game.sumar;
  if (g.result !== null) return;
  g.result = n;
  const correct = g.a + g.b;
  speak(String(n));
  if (n === correct) {
    g.stars++;
    speak('¡Muy bien! ' + g.a + ' más ' + g.b + ' es ' + correct);
    setTimeout(() => celebrate('➕ ' + g.a + ' + ' + g.b + ' = ' + correct + ' 🌟'), 300);
  } else {
    speak('No es ese. La respuesta es ' + correct);
  }
  renderGames();
}

// ── JUEGO 7: Más o Menos ──────────────────
function initMasoMenos() {
  const g = S.game.masomenos;
  let a = randInt(1, 9), b = randInt(1, 9);
  while (a === b) b = randInt(1, 9);
  g.grupoA   = a;
  g.grupoB   = b;
  g.emoji    = MATH_EMOJIS[randInt(0, MATH_EMOJIS.length - 1)];
  g.pregunta = Math.random() > 0.5 ? 'mas' : 'menos';
  g.selected = null;
}

function renderMasoMenos() {
  const g = S.game.masomenos;
  const correcta = g.pregunta === 'mas'
    ? (g.grupoA > g.grupoB ? 'A' : 'B')
    : (g.grupoA < g.grupoB ? 'A' : 'B');

  const pregTexto = g.pregunta === 'mas' ? '¿Cuál tiene MÁS?' : '¿Cuál tiene MENOS?';
  const pregColor = g.pregunta === 'mas' ? '#10b981' : '#ef4444';

  const tarjeta = (letra, cant) => {
    const objs = Array(cant).fill(g.emoji).join(' ');
    let bg = '#fff', border = '3px solid #e5e7eb', shadow = '0 4px 16px rgba(0,0,0,.07)';
    if (g.selected) {
      if (letra === correcta) { bg = '#d1fae5'; border = '4px solid #10b981'; shadow = '0 6px 22px rgba(16,185,129,.3)'; }
      else if (letra === g.selected) { bg = '#fee2e2'; border = '4px solid #ef4444'; }
    }
    const tick = g.selected && letra === correcta ? '<div style="font-size:2rem;margin-top:8px">✅</div>' :
                 g.selected && letra === g.selected && letra !== correcta ? '<div style="font-size:2rem;margin-top:8px">❌</div>' : '';
    return `
      <div onclick="masoMenosElegir('${letra}')"
        style="background:${bg};border:${border};border-radius:22px;
        padding:16px 10px;text-align:center;cursor:${g.selected?'default':'pointer'};
        box-shadow:${shadow};transition:all .25s;flex:1">
        <div style="font-family:'Fredoka One',cursive;font-size:1.1rem;color:#888;margin-bottom:8px">
          Grupo ${letra}
        </div>
        <div style="font-size:clamp(1.2rem,4vw,1.7rem);line-height:1.6;word-break:break-all">
          ${objs}
        </div>
        <div style="font-family:'Fredoka One',cursive;font-size:1.6rem;color:#555;margin-top:8px">
          ${cant}
        </div>
        ${tick}
      </div>`;
  };

  const resultBanner = g.selected ? (
    g.selected === correcta ? `
    <div class="result-banner" style="background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 22px rgba(16,185,129,.4)">
      🎉 ¡Correcto! El grupo ${correcta} tiene ${g.pregunta === 'mas' ? 'más' : 'menos'}
      <button class="btn-next" onclick="initMasoMenos();renderGames()" style="margin:10px auto 0">
        Siguiente ▶
      </button>
    </div>` : `
    <div class="result-banner" style="background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 6px 22px rgba(245,158,11,.4)">
      El grupo ${correcta} tiene ${g.pregunta === 'mas' ? 'más' : 'menos'} 💡
      <button class="btn-next" onclick="initMasoMenos();renderGames()"
        style="margin:10px auto 0;background:white;color:#d97706">Otra vez 🔄</button>
    </div>`
  ) : '';

  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:20px">
      <div class="stars-count">${'⭐'.repeat(g.stars)}</div>
      <div style="font-family:'Fredoka One',cursive;font-size:1.3rem;
        color:${pregColor};text-align:center;
        background:${pregColor}18;border:3px solid ${pregColor}55;
        border-radius:18px;padding:12px 24px;width:100%;max-width:360px">
        ${pregTexto}
      </div>
      <div style="display:flex;gap:12px;width:100%;max-width:380px">
        ${tarjeta('A', g.grupoA)}
        ${tarjeta('B', g.grupoB)}
      </div>
      ${resultBanner}
    </div>`;
}

function masoMenosElegir(letra) {
  const g = S.game.masomenos;
  if (g.selected) return;
  g.selected = letra;
  const correcta = g.pregunta === 'mas'
    ? (g.grupoA > g.grupoB ? 'A' : 'B')
    : (g.grupoA < g.grupoB ? 'A' : 'B');
  const val = letra === 'A' ? g.grupoA : g.grupoB;
  speak(String(val));
  if (letra === correcta) {
    g.stars++;
    speak('¡Correcto! El grupo ' + letra + ' tiene ' + (g.pregunta === 'mas' ? 'más' : 'menos'));
    setTimeout(() => celebrate('⚖️ ¡Muy bien! 🌟'), 300);
  } else {
    speak('No es ese. El grupo ' + correcta + ' tiene ' + (g.pregunta === 'mas' ? 'más' : 'menos'));
  }
  renderGames();
}

    renderAbra();
    if (ABRA_STATE.cuentoIdx === CUENTO.length - 1) {
      setTimeout(() => celebrate('📖 ¡Terminaste el cuento! 🌟'), 400);
    }
  }
}
function cuentoPrev() {
  if (ABRA_STATE.cuentoIdx > 0) { ABRA_STATE.cuentoIdx--; renderAbra(); }
}

// MARCADOR DE VISITAS (solo para el dueño)
// ══════════════════════════════════════════
(function() {
  const KEY_N  = 'aac_visitas';
  const KEY_1  = 'aac_primera';
  const KEY_U  = 'aac_ultima';
  const KEY_TS = 'aac_sesion';

  // — Registrar visita (una por sesión) —
  const sesionActual = sessionStorage.getItem(KEY_TS);
  if (!sesionActual) {
    sessionStorage.setItem(KEY_TS, '1');
    const total  = parseInt(localStorage.getItem(KEY_N) || '0') + 1;
    const hoy    = new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});
    const hora   = new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'});
    if (!localStorage.getItem(KEY_1)) localStorage.setItem(KEY_1, hoy);
    localStorage.setItem(KEY_N, total);
    localStorage.setItem(KEY_U, hoy + ' ' + hora);
  }

  // — Mostrar panel —
  let panelVisible = false;
  let hideTimer = null;

  window.showVisitPanel = function() {
    if (panelVisible) { closeVisitPanel(); return; }
    panelVisible = true;

    const total   = localStorage.getItem(KEY_N) || '1';
    const primera = localStorage.getItem(KEY_1) || '—';
    const ultima  = localStorage.getItem(KEY_U) || '—';

    const el = document.createElement('div');
    el.id = 'visit-panel';
    el.innerHTML = `
      <span class="vp-close" onclick="closeVisitPanel()">✕</span>
      <div class="vp-title">👁️ MARCADOR DE VISITAS</div>
      <div class="vp-big">${total}</div>
      <div style="text-align:center;font-size:.72rem;opacity:.6;margin-bottom:12px;font-family:'Nunito',sans-serif">visitas totales</div>
      <div class="vp-row">
        <span class="vp-label">Primera visita</span>
        <span class="vp-val" style="font-size:.85rem">${primera}</span>
      </div>
      <div class="vp-row">
        <span class="vp-label">Última visita</span>
        <span class="vp-val" style="font-size:.85rem">${ultima}</span>
      </div>
      <div style="margin-top:10px;font-size:.65rem;opacity:.4;text-align:center;font-family:'Nunito',sans-serif">
        Ctrl+Shift+V para mostrar/ocultar
      </div>`;
    document.body.appendChild(el);

    // auto-cierre a los 18 segundos
    clearTimeout(hideTimer);
    hideTimer = setTimeout(closeVisitPanel, 18000);
  };

  window.closeVisitPanel = function() {
    const el = document.getElementById('visit-panel');
    if (!el) return;
    el.classList.add('hide');
    setTimeout(() => { el.remove(); panelVisible = false; }, 300);
    clearTimeout(hideTimer);
  };

  // — Atajos —
  // Escritorio: Ctrl + Shift + V
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key === 'V') {
      e.preventDefault();
      showVisitPanel();
    }
  });

  // Móvil: 5 toques rápidos en la barra de progreso
  let tapCount = 0, tapTimer = null;
  document.getElementById('progress-bar').addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => tapCount = 0, 1500);
    if (tapCount >= 5) { tapCount = 0; showVisitPanel(); }
  });
})();
